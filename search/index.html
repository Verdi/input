<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#090909">
<title>Input · Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Poppins';font-weight:800;font-display:swap;src:url(https://verdi.github.io/input/assets/fonts/poppins-800-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(https://verdi.github.io/input/assets/fonts/ibm-plex-mono-400-latin.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;font-display:swap;src:url(https://verdi.github.io/input/assets/fonts/ibm-plex-mono-700-latin.woff2) format('woff2')}
@font-face{font-family:'Gelasio';font-weight:400;font-display:swap;src:url(https://verdi.github.io/input/assets/fonts/gelasio-400-latin.woff2) format('woff2')}
:root{--live:#E30202;--cued:#19ECFF;--hover:#FFD919;--magenta:#F51186;--blue:#1616DE;--green:#15D515;--dark:#090909;
--page:#1D1D1D;--bar:#090909;--ink:#E5E5E5;--soft:#A8A8A8;--visited:var(--cued);
--ui:'Poppins',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Gelasio',Georgia,serif;--gutter:20px}
@media (prefers-color-scheme:light){:root{color-scheme:light;--page:#FFFFFF;--bar:#E5E5E5;--ink:#090909;--soft:#5A5A5A;--visited:var(--blue)}}
*{box-sizing:border-box}
html{background:var(--dark);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--dark);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto}a{color:inherit}
.site-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
min-height:56px;padding:env(safe-area-inset-top) var(--gutter) 0;background:var(--dark);color:#E5E5E5;
font-family:var(--mono);font-weight:700;font-size:16px;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--ui);font-weight:800;font-size:22px;letter-spacing:-.01em}
.clock{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet{flex:1;display:flex;flex-direction:column;background:var(--page)}
.colorbars{display:block;width:100%;height:24px}.colorbars.bottom{margin-top:auto}
.site-nav{display:flex;flex-wrap:wrap;gap:16px;padding:24px var(--gutter) 0;max-width:calc(1112px + 2*var(--gutter));width:100%;margin:0 auto}
.site-nav .btn{min-width:0;height:38px;font-size:14px}
.site-nav .btn[aria-current]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.page{width:100%;max-width:calc(1112px + 2*var(--gutter));margin:0 auto 60px;padding:0 var(--gutter)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.page-title{margin:48px 0 0;font-family:var(--ui);font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere}
.run-date{margin:14px 0 0;font-family:var(--mono);font-size:13px;font-weight:700;text-transform:uppercase}
.search input{width:312px;max-width:100%;height:38px;padding:0 12px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;font-family:var(--mono);font-size:13px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--soft);text-transform:uppercase;opacity:1}
.search input:focus{outline:2px solid var(--hover);outline-offset:0}
.pager{display:flex;justify-content:space-between;margin-top:64px;padding-top:24px;border-top:1.5px solid var(--soft)}
.pager .older{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:172px;height:46px;padding:0 16px;background:var(--page);color:var(--ink);text-decoration:none;border:1.5px solid currentColor;font-family:var(--ui);font-size:16px;text-transform:uppercase;box-shadow:3px 3px 0 rgba(0,0,0,.45);white-space:nowrap}
.btn:hover,.btn:focus-visible{background:var(--hover);color:var(--dark);border-color:var(--hover);outline:none}
.btn:active{translate:3px 3px;box-shadow:none}
.bb-heading{margin:56px 0 24px;padding-top:18px;border-top:1.5px solid var(--soft);font-family:var(--mono);font-size:14px;font-weight:700;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px}
.card{display:flex;flex-direction:column;padding:12px;margin:-12px;color:inherit}
.card-link{display:block;flex:1;color:inherit;text-decoration:none}
.card-img{display:block;aspect-ratio:16/9;overflow:hidden;background:#000;margin-bottom:12px}
.card-img img{display:block;width:100%;height:100%;object-fit:cover}
.card-date{display:block;font-family:var(--mono);font-size:12px;text-transform:uppercase}
.card-title{display:block;margin:6px 0 8px;font-family:var(--ui);font-weight:800;font-size:17px;line-height:1.2;text-transform:uppercase;overflow-wrap:anywhere}
.card-excerpt{display:block;font-size:15px;line-height:1.5}
.must .card-title{font-size:24px;line-height:1.1}
.card:hover,.card:focus-within{background:var(--lit,var(--hover));color:var(--lit-ink,var(--dark))}
.card-link:focus-visible,.head-link:focus-visible{outline:none}
.cards .card:nth-child(6n+1){--lit:var(--hover)}.cards .card:nth-child(6n+2){--lit:var(--cued)}
.cards .card:nth-child(6n+3){--lit:var(--green)}.cards .card:nth-child(6n+4){--lit:var(--magenta)}
.cards .card:nth-child(6n+5){--lit:var(--live);--lit-ink:#fff}.cards .card:nth-child(6n+6){--lit:var(--blue);--lit-ink:#fff}
.card-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:3px 7px;border:1.5px solid currentColor;font-family:var(--mono);font-size:11px;font-weight:700;line-height:1.3;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.chip:hover,.chip:focus-visible{background:var(--dark);color:#fff;border-color:var(--dark);outline:none}
.votes{display:flex;gap:6px;flex:none}
.vote{display:grid;place-items:center;width:30px;height:26px;border:1.5px solid currentColor;font-family:var(--mono);font-weight:700;font-size:15px;line-height:1;text-decoration:none}
.vote:hover,.vote:focus-visible{background:var(--dark);color:#fff;border-color:var(--dark);outline:none}
.heads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.head{padding:10px;margin:0 -10px}
.head-link{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;color:inherit;text-decoration:none;font-size:16px;line-height:1.4}
.head:not(.has-img) .head-link{grid-template-columns:1fr}
.head .card-img{margin:0}
.head .card-foot{margin-top:8px}
.head-title{display:block}
.head:hover,.head:focus-within{background:var(--hover);color:var(--dark)}
.head:hover .src{color:var(--dark)}
.src{display:block;margin-top:2px;font-family:var(--mono);font-size:12px;text-transform:uppercase;color:var(--soft)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.tag-cloud .btn{min-width:0;height:42px;font-size:15px}
.tag-cloud .count{font-family:var(--mono);font-size:12px}
.empty{margin-top:40px;font-family:var(--mono);font-size:14px;text-transform:uppercase}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards,.heads{grid-template-columns:1fr}.head-link{grid-template-columns:96px 1fr}.page-title{font-size:36px}
.cards:not(.must) .card.has-img .card-link{display:grid;grid-template-columns:128px 1fr;gap:14px}
.cards:not(.must) .card.has-img .card-img{margin:0}.site-header{font-size:13px}.search input{width:100%}.search{width:100%}}
</style></head><body>
<header class="site-header"><a class="brand" href="/input/">📡 Input</a><span class="clock">Thu Nov 26 · 5:52 PM</span></header>
<div class="sheet">
<img class="colorbars" src="https://verdi.github.io/input/assets/colorbar-strip.svg" alt="">
<nav class="site-nav" aria-label="Site"><a class="btn" href="/input/">Latest</a><a class="btn" href="/input/tags/">Tags</a><a class="btn" href="/input/search/" aria-current="page">Search</a></nav>
<main class="page"><div class="top"><div><h1 class="page-title">Search</h1><p class="run-date" id="note">Loading…</p></div><form class="search" action="/input/search/" role="search"><input type="search" name="q" value="" placeholder="Search everything" aria-label="Search everything" autocomplete="off"></form></div><div class="cards" id="results" style="margin-top:48px"></div><script>
const q0 = new URLSearchParams(location.search).get('q') || '';
const box = document.querySelector('.search input'), out = document.getElementById('results'), note = document.getElementById('note');
box.value = q0;
let items = [];
function run() {
  const words = box.value.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { out.innerHTML = ''; note.textContent = items.length + ' items. Type to search.'; return; }
  const hits = items.filter(it => words.every(w => it.t.includes(w)));
  note.textContent = hits.length + (hits.length === 1 ? ' result' : ' results');
  out.innerHTML = hits.map(it => it.h).join('');
}
fetch('/input/search.json').then(r => r.json()).then(d => { items = d; run(); });
box.addEventListener('input', () => { history.replaceState(null, '', box.value ? '?q=' + encodeURIComponent(box.value) : location.pathname); run(); });
document.querySelector('.search').addEventListener('submit', ev => ev.preventDefault());
box.focus();
</script></main>
<img class="colorbars bottom" src="https://verdi.github.io/input/assets/colorbar-strip.svg" alt="">
</div></body></html>
